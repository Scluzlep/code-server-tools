name: Build and Push Code-Server

on:
  workflow_dispatch:
    inputs:
      rebuild_toolchain:
        description: '是否重新构建重型基础工具链 (dev-toolchain-base)?'
        required: false
        type: boolean
        default: false
      force_runner:
        description: '是否强制构建并发布最终 Runner 镜像 (code-server-withtools)?'
        required: false
        type: boolean
        default: false
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 定时检测上游更新
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # Job 0: 环境初始化与上游更新检测
  # ----------------------------------------------------------------------------
  check-update:
    runs-on: ubuntu-24.04-arm
    outputs:
      should_build_toolchain: ${{ steps.decide.outputs.should_build_toolchain }}
      should_build_runner: ${{ steps.decide.outputs.should_build_runner }}
      upstream_tag: ${{ steps.upstream.outputs.latest_upstream_tag }}
      short_tag: ${{ steps.upstream.outputs.short_upstream_tag }}
      upstream_digest: ${{ steps.upstream.outputs.latest_upstream_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load .env configuration
        run: |
          grep -v '^#' .env | grep '=' >> $GITHUB_ENV

      - name: Check upstream code-server release
        id: upstream
        run: |
          chmod +x scripts/check-upstream.sh
          ./scripts/check-upstream.sh

      - name: Decide build actions
        id: decide
        run: |
          # 1. 工具链严格限制：仅在手动勾选 rebuild_toolchain 时构建
          if [ "${{ github.event.inputs.rebuild_toolchain }}" = "true" ]; then
            echo "should_build_toolchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build_toolchain=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. 判断 Runner 是否需要构建
          if [ "${{ github.event.inputs.rebuild_toolchain }}" = "true" ] || [ "${{ github.event.inputs.force_runner }}" = "true" ]; then
            echo "should_build_runner=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_build_runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build_runner=true" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # Job 1: 重型工具链镜像构建 (仅在手动勾选 rebuild_toolchain 时执行，原生 ARM64)
  # ----------------------------------------------------------------------------
  build-toolchain:
    needs: [check-update]
    if: needs.check-update.outputs.should_build_toolchain == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load .env configuration
        run: |
          grep -v '^#' .env | grep '=' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Toolchain Base (Native ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.toolchain
          platforms: linux/arm64
          push: true
          build-args: |
            TOOLCHAIN_VERSION=${{ env.TOOLCHAIN_VERSION }}
            GRADLE_VERSION=${{ env.GRADLE_VERSION }}
            JDK25_URL=${{ env.JDK25_URL }}
            PYTHON_VERSION_310=${{ env.PYTHON_VERSION_310 }}
            PYTHON_VERSION_312=${{ env.PYTHON_VERSION_312 }}
            PYTHON_VERSION_313=${{ env.PYTHON_VERSION_313 }}
            PYTHON_VERSION_314=${{ env.PYTHON_VERSION_314 }}
            GO_VERSION_1=${{ env.GO_VERSION_1 }}
            GO_VERSION_2=${{ env.GO_VERSION_2 }}
            ANDROID_CMDLINE_TOOLS_VERSION=${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
            ANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }}
            ANDROID_BUILD_TOOLS=${{ env.ANDROID_BUILD_TOOLS }}
            KOTLIN_VERSION=${{ env.KOTLIN_VERSION }}
            JADX_VERSION=${{ env.JADX_VERSION }}
            APKTOOL_VERSION=${{ env.APKTOOL_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.TOOLCHAIN_IMAGE_NAME }}:${{ env.TOOLCHAIN_VERSION }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.TOOLCHAIN_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=toolchain-arm64
          cache-to: type=gha,mode=max,scope=toolchain-arm64

      - name: Record and Release Toolchain Version with .env snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p versions
          cp .env "versions/toolchain-v${{ env.TOOLCHAIN_VERSION }}.env"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "toolchain-v${{ env.TOOLCHAIN_VERSION }}" -m "Release dev-toolchain-base v${{ env.TOOLCHAIN_VERSION }}" || true
          git push origin "toolchain-v${{ env.TOOLCHAIN_VERSION }}" || true
          gh release create "toolchain-v${{ env.TOOLCHAIN_VERSION }}" \
            --title "dev-toolchain-base v${{ env.TOOLCHAIN_VERSION }}" \
            --notes-file .env \
            "versions/toolchain-v${{ env.TOOLCHAIN_VERSION }}.env" || echo "Release tag already exists"

  # ----------------------------------------------------------------------------
  # Job 2: 组装 Final Runner 镜像 
  # ----------------------------------------------------------------------------
  build-runner:
    needs: [check-update, build-toolchain]
    if: |
      always() &&
      needs.check-update.outputs.should_build_runner == 'true' &&
      (needs.build-toolchain.result == 'success' || needs.build-toolchain.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load .env configuration
        run: |
          grep -v '^#' .env | grep '=' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Final Runner Image (Native ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            CODE_SERVER_VERSION=${{ needs.check-update.outputs.upstream_tag || env.CODE_SERVER_VERSION }}
            TOOLCHAIN_VERSION=${{ env.TOOLCHAIN_VERSION }}
            TOOLCHAIN_IMAGE=${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.TOOLCHAIN_IMAGE_NAME }}:${{ env.TOOLCHAIN_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.RUNNER_IMAGE_NAME }}:${{ needs.check-update.outputs.upstream_tag || env.CODE_SERVER_VERSION }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.RUNNER_IMAGE_NAME }}:${{ needs.check-update.outputs.short_tag || env.CODE_SERVER_VERSION }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.RUNNER_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.RUNNER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=runner-arm64
          cache-to: type=gha,mode=max,scope=runner-arm64
