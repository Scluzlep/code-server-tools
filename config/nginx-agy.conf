worker_processes 1;
pid /config/.cache/agy/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /config/.cache/agy/body;
    proxy_temp_path /config/.cache/agy/proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Preserve the original HTTPS scheme when 1Panel terminates TLS.
    map $http_x_forwarded_proto $client_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen 0.0.0.0:8443;
        server_name _;
        client_max_body_size 0;

        location = /agy { return 308 /agy/; }

        location = /agy/ {
            auth_basic "Antigravity Shell";
            auth_basic_user_file /config/.config/agy/.htpasswd;
            default_type text/html;
            root /usr/local/share;
            try_files /agy/index.html =404;
            add_header Cache-Control "no-store" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location = /agy/terminal { return 308 /agy/terminal/; }

        location ^~ /agy/terminal/ {
            auth_basic "Antigravity Shell";
            auth_basic_user_file /config/.config/agy/.htpasswd;
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $client_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location / {
            proxy_pass http://127.0.0.1:8444;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $client_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
